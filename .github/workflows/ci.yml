# Test and compile IC-SDR on Windows, Linux, and macOS.
name: CI

on:
  push:
    branches: [english, main]
  pull_request:
    branches: [english, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build TETRA ACELP codec
        shell: bash
        run: bash scripts/build-libtetradec.sh

      - name: Test non-GUI packages
        run: go test ./internal/... ./cmd/...

      - name: Compile GUI packages
        shell: bash
        run: |
          mkdir -p dist/testbin
          go test -c -o dist/testbin/screens.test ./screens
          go test -c -o dist/testbin/simpleui.test ./simpleui
          go test -c -o dist/testbin/main.test .

      - name: Install Linux display for GUI tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libxext6

      - name: Run GUI package tests
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              xvfb-run -a go test -p 1 ./screens ./simpleui
              ;;
            Windows)
              go test -p 1 ./screens ./simpleui
              ;;
            macOS)
              # raylib-go's embedded dylib fails to load on GitHub macos-latest
              # (arm64) runners; compilation above still proves the packages build.
              echo "Skipping GUI test execution on macOS CI (raylib dylib)."
              ;;
          esac

      - name: Build host binary
        shell: bash
        run: |
          extra=""
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            extra="-H=windowsgui"
            suffix=".exe"
          fi
          go build -trimpath -ldflags "-s -w $extra" -o "ic-sdr${suffix}" .

  cross-compile:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            extra: -H=windowsgui
          - goos: windows
            goarch: arm64
            ext: .exe
            extra: -H=windowsgui
          - goos: linux
            goarch: amd64
            ext: ""
            extra: ""
          - goos: linux
            goarch: arm64
            ext: ""
            extra: ""
          - goos: darwin
            goarch: amd64
            ext: ""
            extra: ""
          - goos: darwin
            goarch: arm64
            ext: ""
            extra: ""
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w ${{ matrix.extra }}" \
            -o "dist/IC-SDR-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: IC-SDR-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/IC-SDR-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
