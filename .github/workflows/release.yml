# Build every supported OS/arch and publish a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        default: v0.5.0-english.1

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build TETRA ACELP codec
        run: bash scripts/build-libtetradec.sh

      - name: Test
        run: |
          set -euo pipefail
          go test ./internal/... ./cmd/...
          mkdir -p dist/testbin
          go test -c -o dist/testbin/screens.test ./screens
          go test -c -o dist/testbin/simpleui.test ./simpleui
          go test -c -o dist/testbin/main.test .
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libxext6
          xvfb-run -a go test -p 1 ./screens ./simpleui

  package:
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            extra: -H=windowsgui
            ext: .exe
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            extra: -H=windowsgui
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            extra: ""
            ext: ""
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extra: ""
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            extra: ""
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            extra: ""
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux SDR build tools
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make autoconf automake libtool pkg-config python3 patchelf

      - name: Install macOS SDR build tools
        if: matrix.goos == 'darwin'
        run: brew install autoconf automake libtool pkg-config cmake

      - name: Build TETRA ACELP codec
        shell: bash
        run: bash scripts/build-libtetradec.sh

      - name: Build portable SoapySDR runtime
        if: matrix.goos != 'windows'
        shell: bash
        run: bash scripts/build-soapy-runtime.sh

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pkg
          go build -trimpath -ldflags "-s -w ${{ matrix.extra }}" \
            -o "dist/pkg/IC-SDR-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .

      - name: Stage data files
        shell: bash
        run: |
          set -euo pipefail
          dest="dist/pkg/DATA/tools/tetra/runtime/bin"
          mkdir -p "$dest"
          lib=""
          for cand in \
            DATA/tools/tetra/runtime/bin/libtetradec.dll \
            DATA/tools/tetra/runtime/bin/libtetradec.so \
            DATA/tools/tetra/runtime/bin/libtetradec.dylib \
            build/libtetradec/libtetradec.so \
            build/libtetradec/libtetradec.dylib \
            build/libtetradec/libtetradec.dll \
            build/libtetradec/Release/libtetradec.dll
          do
            if [ -f "$cand" ]; then
              lib="$cand"
              break
            fi
          done
          if [ -z "$lib" ]; then
            echo "libtetradec was not built" >&2
            exit 1
          fi
          base="$(basename "$lib")"
          ext="${base##*.}"
          stem="${base%.*}"
          cp -f "$lib" "$dest/$base"
          for slot in 2 3 4; do
            cp -f "$lib" "$dest/${stem}-ts${slot}.${ext}"
          done
          runtime="DATA/runtime/${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -d "$runtime" ]; then
            mkdir -p "dist/pkg/DATA/runtime"
            cp -a "$runtime" "dist/pkg/DATA/runtime/"
          fi

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          name="IC-SDR-${{ matrix.goos }}-${{ matrix.goarch }}"
          python - <<PY
          import pathlib, shutil
          src = pathlib.Path("dist/pkg")
          if "${{ matrix.goos }}" == "windows":
              shutil.make_archive("dist/" + "$name", "zip", root_dir=src)
          else:
              shutil.make_archive("dist/" + "$name", "gztar", root_dir=src)
          print("wrote archive for", "$name")
          PY
          ls -lh dist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: IC-SDR-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/IC-SDR-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            dist/IC-SDR-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum IC-SDR-* > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TITLE="IC-SDR ${TAG} — Windows, Linux, macOS"
          NOTES="$(cat <<'EOF'
          Multi-OS build of the English IC-SDR branch based on upstream v0.5.0 (UI, languages, region band plans, TETRA voice, and Digital Auto).

          Binaries are compiled with `CGO_ENABLED=0` (embedded raylib). Each archive includes four timeslot copies of `libtetradec`.

          - **Windows amd64 / arm64** — GUI executable plus a native TETRA codec. The portable SoapySDR runtime for x64 is still the Windows bundle from previous English releases (`DATA/runtime/windows-x64`); ARM64 Windows prefers `windows-arm64` when present and otherwise falls back to that x64 tree. Plug in any radio whose Soapy module is in that runtime (RTL-SDR, SDRplay with the vendor API, and extra modules shipped in the zip).
          - **Linux amd64/arm64** and **macOS amd64/arm64** — desktop UI, TETRA codec, and a bundled SoapySDR runtime under `DATA/runtime/<os>-<arch>` with RTL-SDR plus best-effort HackRF One/Pro (libhackrf 2026.01.3), Airspy, AirspyHF, and SoapyRemote. A system SoapySDR install is still used as fallback for Lime, Pluto, UHD, BladeRF, and SDRplay (SDRplay also needs the vendor API).

          The TETRA codec is [blkph0x/libtetradec](https://github.com/blkph0x/libtetradec). It decodes **clear** TCH/ACELP only. Encrypted TETRA is not decrypted.

          SHA-256 checksums are in `SHA256SUMS.txt`.
          EOF
          )"
          shopt -s nullglob
          assets=(dist/IC-SDR-*.zip dist/IC-SDR-*.tar.gz dist/SHA256SUMS.txt)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no release archives were downloaded" >&2
            ls -la dist || true
            exit 1
          fi
          ls -lh "${assets[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "${assets[@]}" --title "$TITLE" --notes "$NOTES" --target "${GITHUB_SHA}"
          fi
